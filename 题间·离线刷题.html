/* Shared components consume palette tokens so every page follows the theme. */
::selection{background:var(--selection)}
h1,h2,h3,.brand-name{color:var(--heading)}
button:focus-visible,a:focus-visible{outline-color:var(--focus)}
input:focus,select:focus,textarea:focus{outline-color:var(--focus)}
.nav-button{color:var(--muted)}
.status-dot{background:var(--green)}
.avatar{background:var(--soft);color:var(--accent)}
.button:hover,.mode:hover,.option:hover:not(:disabled){border-color:var(--focus)}
.button.primary,.segment button.active{background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-fg)}
.button.danger{border-color:var(--bad-border)}
.hero{background:var(--hero-bg);color:var(--hero-text);border:1px solid var(--line)}
.hero h2,.hero-progress strong{color:var(--hero-text)}
.hero:after{color:color-mix(in srgb,var(--hero-text) 3%,transparent)}
.hero-label,.hero-meta,.hero-progress .row{color:var(--hero-muted)}
.hero .progress-track{background:color-mix(in srgb,var(--hero-text) 15%,transparent)}
.hero .progress-fill{background:var(--hero-text)}
.hero .button{background:var(--hero-button-bg);color:var(--hero-button-fg)}
.day-bar{background:var(--soft)}
.tip strong{color:var(--secondary-fg)}
.bank-cover{background:var(--soft);border-color:var(--line);color:var(--accent);box-shadow:inset 4px 0 var(--line)}
.option-letter{border-color:var(--line)}
.option.selected{border-color:var(--accent)}
.option.correct{background:var(--goodsoft);border-color:var(--good-border)}
.option.correct .option-letter{color:var(--correct-label-fg)}
.option.incorrect{border-color:var(--bad-border)}
.option.incorrect .option-letter{color:var(--error-label-fg)}
.answer-panel.good{background:var(--goodsoft);border-color:var(--good-border)}
.answer-panel.bad{border-color:var(--bad-border)}
.number-button.good{background:var(--goodsoft)}
.legend i.good{background:var(--green)}.legend i.bad{background:var(--red)}
.note-box textarea,.form-field input,.form-field select,.form-field textarea{background:var(--input-bg)}
.drop-zone{border-color:var(--focus)}.drop-zone.dragging{background:var(--soft)}
.modal-backdrop{background:rgba(0,0,0,.4)}
.toggle{background:var(--line)}
#toast{background:var(--primary-bg);color:var(--primary-fg);border:1px solid var(--line)}
.theme-setting{display:block}.theme-setting>p{margin-bottom:15px}
.theme-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:15px}
.theme-choice{border:1px solid var(--line);border-radius:8px;padding:11px 5px;color:var(--muted);font-size:10px;background:var(--surface2)}
.theme-choice.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-swatch{display:block;height:22px;width:34px;margin:0 auto 9px;border:1px solid #00000012;border-radius:5px;overflow:hidden;position:relative;background:var(--swatch-bg)}
.theme-swatch:after{content:'';position:absolute;inset:0 auto 0 0;width:10px;background:var(--swatch-accent)}
.theme-swatch[data-palette=system]{--swatch-bg:#f6f7fa;--swatch-accent:#11141b}
.theme-swatch[data-palette=light]{--swatch-bg:#f6f7fa;--swatch-accent:#5b5bd6}
.theme-swatch[data-palette=dark]{--swatch-bg:#0b0d12;--swatch-accent:#6366f1}
.theme-swatch[data-palette=eye]{--swatch-bg:#c9e2c6;--swatch-accent:#2e7d32}
.theme-swatch[data-palette=solar]{--swatch-bg:#f3ecda;--swatch-accent:#b45309}
.theme-swatch[data-palette=classic-light]{--swatch-bg:#f6f7f9;--swatch-accent:#236b57}
.theme-swatch[data-palette=classic-dark]{--swatch-bg:#171d20;--swatch-accent:#78b99c}
.theme-swatch[data-palette=classic-eye]{--swatch-bg:#edf0e3;--swatch-accent:#236b57}
.mode-progress{display:block;font-size:10px;color:var(--accent);margin-top:8px;font-weight:450}
.question-labels{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.history-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;line-height:1.7;padding:3px 8px;border-radius:5px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.history-badge.history-right{color:var(--green);background:var(--goodsoft);border-color:var(--good-border)}
.history-badge.history-wrong{color:var(--red);background:var(--redsoft);border-color:var(--bad-border)}
.lifetime-progress{font-size:10px;color:var(--muted);line-height:1.8;margin:15px 0 0;padding:12px 0;border-top:1px solid var(--line)}
.lifetime-progress strong{color:var(--accent);font-weight:550}.number-button{position:relative}
.number-button.historical{background:var(--soft);border-color:var(--focus);color:var(--accent)}
.number-button.historical:after{content:'';position:absolute;right:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.legend{flex-wrap:wrap;row-gap:8px}.legend i.historical{background:var(--accent);border-radius:50%}
.mode-progress-summary{font-size:12px;color:var(--muted);padding:12px 15px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);line-height:1.9;margin-bottom:15px}
.mode-progress-summary strong{color:var(--accent);font-weight:550}
.save-indicator.save-failed{color:var(--red)}
.focus-mode .sidebar,.focus-mode .topbar,.focus-mode .content>.practice-layout>div>.footer-note{display:none}
.focus-mode .app-shell{display:block}
.focus-mode .content{max-width:1240px;padding:40px 32px;margin:0 auto}
.focus-actions{display:flex;gap:8px;margin-top:20px}
.focus-actions .button{flex:1;padding:10px 8px;font-size:11px}
.focus-save{font-size:10px;color:var(--muted);line-height:1.8;text-align:center;margin-top:15px}
.exam-mode{grid-column:1/-1}
.exam-mode .mode-progress{display:inline-block;margin:0 0 0 15px}
.exam-mode small{display:inline-block}
.exam-rules{margin-bottom:22px}
.exam-counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.exam-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.exam-counts .form-field,.exam-settings-grid .form-field{min-width:0}
.exam-resume-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--focus);border-radius:10px;background:var(--soft);padding:18px;margin-top:15px}
.exam-resume-banner strong{display:block;font-size:12px;margin-bottom:7px}
.exam-resume-banner span{font-size:11px;color:var(--muted);line-height:1.8}
.exam-timer{padding-bottom:22px;margin-bottom:23px;border-bottom:1px solid var(--line)}
.exam-timer>span{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.exam-timer svg{width:15px;height:15px}
.exam-timer strong{display:block;font-size:32px;font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:12px 0 6px;color:var(--accent)}
.exam-timer strong.bad-text{color:var(--red)}
.exam-timer small{font-size:10px;color:var(--muted)}
.number-button.exam-answered{background:var(--soft);color:var(--accent);border-color:var(--focus)}
.number-button.exam-marked:after{content:'';position:absolute;right:3px;top:3px;width:5px;height:5px;background:var(--accent);transform:rotate(45deg)}
.legend i.exam-answered{background:var(--accent)}
.legend i.exam-marked{background:var(--accent);transform:rotate(45deg)}
.exam-review-filter{width:100%;margin:18px 0}
.exam-history-score{font-size:30px;font-weight:600;min-width:80px;font-variant-numeric:tabular-nums}
.exam-history-score small{font-size:11px;font-weight:400;margin-left:5px}
.exam-result-card{max-width:850px;margin:0 auto;padding:42px;background:var(--surface);border:1px solid var(--line);border-radius:13px;text-align:center}
.exam-score{font-size:74px;font-weight:600;letter-spacing:-3px;margin:22px 0 12px;font-variant-numeric:tabular-nums}
.exam-score small{font-size:16px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:10px}
.exam-result-card h2{font-size:20px;font-weight:550;margin-bottom:13px}
.exam-breakdown{text-align:left;border-top:1px solid var(--line);margin-top:20px}
.exam-breakdown>div{display:grid;grid-template-columns:85px 60px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);font-size:12px}
.exam-breakdown strong{font-weight:500}.exam-breakdown span{color:var(--muted)}
.exam-result-note{margin:22px 0}
.exam-result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media(max-width:650px){.exam-counts,.exam-settings-grid{gap:10px}.exam-counts label,.exam-settings-grid label{font-size:11px}.exam-mode .mode-progress{display:block;margin:8px 0 0}.exam-result-card{padding:28px 18px}.exam-score{font-size:62px}.exam-breakdown>div{grid-template-columns:60px 35px 1fr;gap:7px;font-size:11px}.exam-resume-banner{padding:14px}.exam-history .data-card>.button{margin-left:0}.exam-history-score{min-width:60px;font-size:25px}}
@media(max-width:650px){.focus-mode .content{padding:20px 16px}}

      else if (el.id === 'auto-next-delay') {
        const seconds = Number(el.value);
        if (!el.value.trim() || !Number.isFinite(seconds) || seconds < 0 || seconds > 60) { el.value = state.settings.autoNextDelay; return toast('请输入 0–60 秒的等待时间，可以填写小数。'); }
        state.settings.autoNextDelay = seconds; clearTimeout(nextTimer); await save();
      }
      else if (el.dataset.setting) { state.settings[el.dataset.setting] = el.checked; await save(); render(); }
    })().catch(report);
  });
  document.addEventListener('input', e => {
    if (accountLocked || accountBusy) return;
    const el = e.target;
    if (/^exam-(count-\d|duration|pass)$/.test(el.id)) updateExamConfig();
    if (el.id === 'bank-search') $('#bank-list').innerHTML = bankRows(el.value);
    if (el.id === 'question-search') { const start = el.selectionStart; ui.query = el.value; ui.listPage = 0; render(); const target = $('#question-search'); target.focus(); target.setSelectionRange(start, start); }
    if (el.id === 'question-note') { const { b, q } = sessionContext(); ensureRecord(b, q).note = el.value; $('#note-status').textContent = '正在保存…'; clearTimeout(noteTimer); noteTimer = setTimeout(() => save().then(() => { if ($('#note-status')) $('#note-status').textContent = '已保存'; }).catch(report), 350); }
    if (el.id === 'import-name') captureImport();
  });
  document.addEventListener('dragover', e => { const drop = e.target.closest('#drop-zone'); if (drop) { e.preventDefault(); drop.classList.add('dragging'); } });
  document.addEventListener('dragleave', e => e.target.closest('#drop-zone')?.classList.remove('dragging'));
  document.addEventListener('drop', e => { const drop = e.target.closest('#drop-zone'); if (drop) { e.preventDefault(); drop.classList.remove('dragging'); readCSV(e.dataTransfer.files[0]).catch(report); } });
  document.addEventListener('keydown', e => {
    if (accountLocked || accountBusy) return;
    if ($('#overlay').children.length) {
      if (e.key === 'Escape') { e.preventDefault(); if ($('#edit-text')) { editorIndex = null; importPreview(); } else closeModal(); }
      if (e.key === 'Tab') { const controls = [...$('#overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,[tabindex="0"]')].filter(x => x.offsetParent !== null); const first = controls[0], last = controls.at(-1); if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); } }
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.id === 'drop-zone') { e.preventDefault(); $('#csv-file').value = ''; $('#csv-file').click(); }
      return;
    }
    if (document.body.classList.contains('answer-sheet-open')) {
      if (e.key === 'Escape') { e.preventDefault(); setAnswerSheet(false); }
      if (e.key === 'Tab') { const controls = [...$('.answer-card').querySelectorAll('button:not(:disabled),select')].filter(el => el.offsetParent !== null), first = controls[0], last = controls.at(-1); if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); } }
      return;
    }
    if (['exam', 'exam-review'].includes(ui.view) && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) {
      if (e.key.length === 1 && /^[a-z]$/i.test(e.key) && ui.view === 'exam') { e.preventDefault(); examChoose(e.key.toUpperCase()).catch(report); }
      else if (['ArrowRight', 'Enter', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); perform(e.key === 'ArrowLeft' ? 'exam-prev' : 'exam-next', {}).catch(report); }
      return;
    }
    if (ui.view !== 'practice' || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
    const { q, answer } = sessionContext(); if (!q) return;
    if (/^[a-z]$/i.test(e.key) && q.options.some(o => o.label === e.key.toUpperCase())) { e.preventDefault(); choose(e.key.toUpperCase()).catch(report); }
    else if (e.key === 'Enter' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); (answer ? next() : q.type === '多选题' ? submit() : Promise.resolve()).catch(report); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next().catch(report); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); navigateQuestion(state.session.index - 1).catch(report); }
  });
  document.addEventListener('focusin', e => { if (e.target.id === 'question-note') document.body.classList.add('editing-note'); });
  document.addEventListener('focusout', e => { if (e.target.id === 'question-note') document.body.classList.remove('editing-note'); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state?.settings.theme === 'system') applyTheme(); });
  window.addEventListener('beforeunload', () => { if (noteTimer) { clearTimeout(noteTimer); save().catch(() => {}); } });
  function freshState(withSeed) {
    const questions = withSeed ? structuredClone(seedQuestions) : [];
    return { version: 1, banks: withSeed ? [{ id: 'builtin-theory', name: '计算机程序设计员 · 三级', questions, createdAt: new Date().toISOString() }] : [], records: {}, session: null, practiceSessions: {}, practiceLast: {}, settings: { ...defaultSettings }, activity: {}, selectedBank: withSeed ? 'builtin-theory' : '', exams: [], activeExam: null };
  }
  async function loadAccount(user) {
    await saveQueue;
    localOwner = user.id;
    let saved = db ? await readDB(localKey('main')) : null;
    cloudMeta = db ? await readDB(localKey('cloud-meta')) || {} : {};
    syncBackups = db ? await readDB(localKey('sync-backups')) || [] : [];
    // Only the original administrator can adopt the pre-account local workspace.
    if (!saved && cloudClient.isAdmin && db) {
      const legacyMeta = await readDB('cloud-meta') || {};
      if (!legacyMeta.userId || legacyMeta.userId === user.id) {
        saved = await readDB('main'); cloudMeta = legacyMeta;
        syncBackups = await readDB('sync-backups') || [];
      }
    }
    state = saved ? C.validateState(saved) : freshState(cloudClient.isAdmin);
    state.settings = { ...defaultSettings, ...state.settings }; state.exams ||= []; state.activeExam ||= null; state.activity ||= dailyData();
    C.fillCategories(state.banks, seedQuestions); C.restorePractice(state);
    ui = { view: 'home', bankId: state.selectedBank || banks()[0]?.id || '', query: '', type: '', chapter: '', listPage: 0, draft: [], showNote: false, cardPage: 0, collectionBank: '' };
    pendingImport = null; editorIndex = null; confirmAction = null;
    if (db) await persistLocal();
  }
  try {
    db = await openDB();
    if (cloudClient?.session) await loadAccount(cloudClient.session.user);
    else if (cloudConfig.enabled) state = freshState(false);
    else { state = await readDB(); cloudMeta = await readDB('cloud-meta') || {}; syncBackups = await readDB('sync-backups') || []; }
    if (state) C.validateState(state);
  } catch (e) { state = null; db = null; storageOK = false; storageError = '本地存储不可用，请在关闭前导出备份'; console.error(e); }
  if (!state) {
    state = freshState(!cloudConfig.enabled || !!cloudClient?.isAdmin);
    try { await save(); } catch (e) { report(e); }
  }
  state.settings = { ...defaultSettings, ...state.settings }; state.activity ||= dailyData(); C.fillCategories(state.banks, seedQuestions); C.restorePractice(state); ui.bankId = state.selectedBank || banks()[0]?.id || ''; ui.collectionBank = ''; state.exams ||= []; state.activeExam ||= null; initCloud(); render(); examTick(); setInterval(examTick, 500); if (cloud && !accountLocked) cloud.run();
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
  if (!storageOK) toast('本地存储不可用。你仍可练习，但请在关闭前导出完整备份。');
})();
